[package]
name = "vin-yl-tape"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/vin-yl-tape-client"]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1"
hex = "0.4.3"
hmac = "0.12"
js-sys = "0.3"
record-descriptor = { git = "https://github.com/wavey-ai/bitneedle.git", branch = "main" }
record-core = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
urlencoding = "2"
worker = "0.8.3"

[dev-dependencies]
ureq = "2"
