[package]
name = "vin-yl-tape-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared Rust client for the YL.VIN tape cache"
repository = "https://github.com/wavey-ai/vin.yl.tape"

[features]
default = ["http"]
http = ["dep:futures-timer", "dep:reqwest"]

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
record-descriptor = { git = "https://github.com/wavey-ai/bitneedle.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
futures-timer = { version = "3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
